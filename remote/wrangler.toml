name = "claake-remote"
main = "worker/index.ts"
compatibility_date = "2025-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/ws", "/healthz", "/vapid-public-key", "/v1/*"]

[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]

# Claake Ask data (schema in migrations/, applied with `wrangler d1 migrations apply claake-ask`).
[[d1_databases]]
binding = "DB"
database_name = "claake-ask"
database_id = "ede41470-aab7-4ede-9cc0-a0f1e9b607ab"
migrations_dir = "migrations"

# Secrets (`wrangler secret put`, or .dev.vars locally): VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY,
# GITHUB_CLIENT_SECRET, ALLOWED_GITHUB_LOGINS (comma-separated GitHub logins of the beta testers)
# and PROVIDER_ENCRYPTION_KEY (base64 of 32 random bytes; it encrypts the subscription credentials).
[vars]
VAPID_SUBJECT = "https://claake-remote.claakecode.workers.dev"
# Public id of the GitHub OAuth App.
GITHUB_CLIENT_ID = "Ov23liwBVsIXBfwTTigG"
