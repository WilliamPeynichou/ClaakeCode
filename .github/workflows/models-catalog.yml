name: Models catalog

on:
  pull_request:
    paths:
      - models.json
      - crates/claakecode-core/src/catalog.rs
      - src/lib/models.ts
      - scripts/check-models.mjs
  push:
    branches:
      - main
    paths:
      - models.json
      - crates/claakecode-core/src/catalog.rs
      - src/lib/models.ts
      - scripts/check-models.mjs

jobs:
  validate:
    name: Validate models.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate catalog (Rust)
        run: cargo test -p claakecode-core catalog
      - name: UI catalog checks
        run: node scripts/check-models.mjs
